# Render Free preview — no paid services, no persistent disks.
# Historical forensic archive is VOLATILE here. GitHub Pages remains the durable public snapshot.
# This is a non-production preview: Render Free spins down after inactivity.
services:
  - type: web
    name: meteoportinatx-backend-free
    runtime: python
    plan: free
    region: frankfurt
    buildCommand: python -m compileall -q src
    startCommand: python -u src/nowcast_backend.py serve
    healthCheckPath: /healthz
    autoDeployTrigger: off
    envVars:
      - key: PYTHON_VERSION
        value: '3.11.11'
      - key: NOWCAST_DATA_ROOT
        value: /tmp/meteoportinatx
      - key: NOWCAST_REQUIRE_DISK
        value: '0'
      - key: PORTINATX_HOME
        value: /tmp/meteoportinatx/portinatx
      - key: PIRINEO_HOME
        value: /tmp/meteoportinatx/portinatx/pirineo
      - key: PIRINEO_EXTENDED
        value: '1'
      - key: PORTINATX_INTERVAL
        value: '300'
      - key: PIRINEO_INTERVAL
        value: '10800'
