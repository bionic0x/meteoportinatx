name: Unified meteorological regression
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile entire source and test tree
        run: python -m compileall -q src tests scripts
      - name: Domain logic, metaanalysis and unified integration
        run: python src/nowcast.py selftest
      - name: Build one portable application
        run: python scripts/build.py
      - name: Confirm no deployment workflow exists
        run: test ! -e .github/workflows/deploy.yml
