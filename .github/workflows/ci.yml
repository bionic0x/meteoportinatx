name: Python synthetic regression
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Basic compile
        run: python -m compileall -q src tests
      - name: Portinatx baseline logic tests
        run: python src/portinatx_degen.py selftest
      - name: Pirineo baseline logic tests
        run: python src/pirineo.py selftest
      - name: 15-day metaanalysis tests
        run: python src/pirineo_meta.py selftest
      - name: Integrated regression suite
        run: python -m unittest discover -s tests -v
