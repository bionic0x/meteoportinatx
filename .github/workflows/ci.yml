name: Unified meteorological regression
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Compile entire source and test tree
        run: python -m compileall -q src tests scripts
      - name: Static analysis (syntax errors, undefined names, dead imports)
        run: |
          python -m pip install --quiet ruff==0.16.9
          ruff check src scripts tests
      - name: Install Playwright driver for real-browser regressions (runner Chrome, no download)
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
        run: npm install --no-save --no-audit --no-fund playwright@1.63.0
      - name: Verify file integrity before running tests
        run: python scripts/integrity.py --check
      - name: Domain logic, metaanalysis and unified integration (browser tests must not skip)
        env:
          METEO_REQUIRE_BROWSER: '1'
        run: python src/nowcast.py selftest
      - name: Browser bridge coherence regression (Node)
        run: node tests/test_public_fetch.cjs
      - name: Route planner engine (Node, synthetic data)
        run: node tests/test_route_engine.cjs
      - name: Five-profile decision view regression (Node)
        run: node tests/test_decision_cards.cjs
      - name: Device sensors and haptic contract (Node)
        run: node tests/test_device_sensors.cjs
      - name: Mountain atmospheric profile contract (Node)
        run: node tests/test_pirineo_atmos.cjs
      - name: Mountain observatory evidence contract (Node)
        run: node tests/test_pirineo_observatory.cjs
      - name: Build one portable application
        run: python scripts/build.py
      - name: Confirm that Pages workflow is separately gated
        run: test -f .github/workflows/deploy.yml
