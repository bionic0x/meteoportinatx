name: Credential expiry

# Falla (y GitHub avisa al propietario) si la clave de AEMET caduca en ≤14 días, ya caducó o no tiene
# fecha registrada. Solo comprueba la presencia del secreto; nunca imprime su valor.
on:
  workflow_dispatch:
  schedule:
    - cron: '17 6 * * *'

permissions:
  contents: read

jobs:
  aemet:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      AEMET_API_KEY: ${{ secrets.AEMET_API_KEY }}
      AEMET_KEY_EXPIRES: ${{ vars.AEMET_KEY_EXPIRES }}
      METEOFRANCE_API_KEY: ${{ secrets.METEOFRANCE_API_KEY }}
      METEOFRANCE_KEY_EXPIRES: ${{ vars.METEOFRANCE_KEY_EXPIRES }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check AEMET and Météo-France key expiry dates
        run: python scripts/check_credential_expiry.py
