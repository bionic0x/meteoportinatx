name: Publish unified meteorological website

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'scripts/**'
      - 'tests/**'
      - '.github/workflows/deploy.yml'
      - 'README.md'
  workflow_dispatch:
  schedule:
    # Static snapshot only; NOT continuous five-minute convective surveillance.
    - cron: '23 */6 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: meteoportinatx-github-pages
  cancel-in-progress: false

jobs:
  export-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      PYTHONUNBUFFERED: '1'
      PORTINATX_HOME: './portinatx_state'
      PIRINEO_HOME: './portinatx_state/pirineo'
      PIRINEO_EXTENDED: '1'
      # Optional local sidecars; none are downloaded by this deployment.
      METEO_SIDECAR_DIR: ${{ github.workspace }}/data/sidecar
      METEO_BACKEND_URL: ${{ vars.METEO_BACKEND_URL }}
      AEMET_API_KEY: ${{ secrets.AEMET_API_KEY }}
      # No household telemetry, owner notes, local state, or secrets are uploaded.
    steps:
      - name: Checkout reviewed source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate meteorological safety and integration
        run: python scripts/build.py
      - name: Restore only the non-sensitive terrain DEM cache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/portinatx_state/pirineo/cache/dem.json
          key: pirineo-dem-terrain-v1-${{ hashFiles('src/pirineo.py') }}
      - name: Report credential presence without revealing values
        run: |
          # Solo presencia/ausencia; nunca se imprime el valor.
          if [ -n "${AEMET_API_KEY}" ]; then
            echo "AEMET_API_KEY: presente" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::AEMET_API_KEY ausente: el eje oficial publicado dependerá solo de MeteoAlarm"
            echo "AEMET_API_KEY: AUSENTE (eje oficial solo MeteoAlarm)" >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Acquire real meteorological data for both domains
        run: python -u src/nowcast.py export
      - name: Fail closed on missing or stale data and stage static website
        run: python scripts/build_site.py --max-age-hours 4
      - name: Acquire shared regional modules and stage reports and downloads
        run: python scripts/build_zones.py
      - name: Prohibit state/credentials and validate static output
        run: |
          test -f site/index.html
          test -f site/zones/portinatx/index.html
          test -f site/zones/pirineo/index.html
          test -f site/downloads/MeteoPortinatx.pyz
          test -f site/decidir/index.html
          test -f site/decision_cards.js
          test -f site/portinatx/api/core.json
          test -f site/pirineo/api/core.json
          test -f site/pirineo/api/extended.json
          test -f site/pirineo/ruta/index.html
          test -f site/pirineo/ruta/route_engine.js
          test -z "$(find site -type f \( -name 'config.env' -o -name 'state.json' -o -name '*.jsonl' -o -name '*.pem' -o -name '.env*' \) -print -quit)"
          python - <<'PY'
          import json
          from pathlib import Path
          cores = {}
          for domain in ('portinatx', 'pirineo'):
              core = json.loads((Path('site') / domain / 'api/core.json').read_text())
              assert core.get('issued'), domain
              cores[domain] = core
          assert any(source.get('status') == 'ok' for source in cores['portinatx'].get('sources', [])), 'No usable coastal source'
          assert cores['pirineo'].get('puntos'), 'No usable mountain forecast points'
          grid = json.loads((Path('site') / 'pirineo' / 'api/grid.json').read_text())
          needed = ('temperature_2m', 'dew_point_2m', 'precipitation', 'wind_speed_10m', 'wind_gusts_10m', 'freezing_level_height')
          if not all(grid.get('fields', {}).get(v) for v in needed) or not grid.get('elev'):
              print('::warning::Pirineo route grid incomplete; route planner will fail closed')
          # Never publish user-authored reports from a local persistent state.
          governance = cores['portinatx'].get('governance') or {}
          for field in ('dissent', 'anomalies', 'overrides'):
              assert not governance.get(field), 'Private owner governance would be public: ' + field
          assert not any(c.get('root') == 'owner' for c in governance.get('claims', [])), 'Owner evidence would be public'
          print('Two evidence-backed domains; private state excluded')
          PY
      - name: Configure GitHub Pages (requires Settings → Pages → GitHub Actions)
        uses: actions/configure-pages@v5
      # A re-run reuses the same workflow run_id; artifact names must differ per attempt.
      # deploy-pages selects by name, so both actions use the same run_attempt suffix.
      - name: Upload static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: site
          name: github-pages-${{ github.run_attempt }}
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
